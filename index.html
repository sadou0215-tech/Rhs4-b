<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4Bレジ</title>
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#1a2a29;--sub:#5d706e;--line:#d5dedc;--main:#0f5b57;--onmain:#fff;--hi:#f2c230;--onhi:#2a2100;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101817;--panel:#182322;--ink:#e8f0ef;--sub:#93a8a5;--line:#2b3b39;--main:#4fb3ab;--onmain:#06201e;--danger:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{width:100%;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.shop{display:flex;flex-direction:column;min-height:0;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 16px}
h1{font-size:1.25rem;margin:0}
.toggle{border:2px solid var(--main);background:none;color:var(--main);border-radius:99px;padding:6px 16px;font-weight:700}
.toggle[aria-pressed=true]{background:var(--main);color:var(--onmain)}
.grid{padding:4px 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start;grid-auto-rows:max-content}
.tile{display:block;align-self:start;position:relative;border:0;padding:0;background:var(--panel);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .pic{position:relative;width:100%;aspect-ratio:1;background:#fff;overflow:hidden}
.tile .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#fff}
.tile .noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;color:var(--sub);background:var(--line)}
.tile .info{padding:8px 10px 10px}
.tile .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .pr{color:var(--sub)}
.badge{position:absolute;top:8px;right:8px;min-width:32px;height:32px;padding:0 8px;border-radius:99px;background:var(--hi);color:var(--onhi);font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px #0003}
.edit .tile{outline:2px dashed var(--main);outline-offset:-2px}
.add{display:grid;place-items:center;min-height:170px;border:2px dashed var(--main);background:none;color:var(--main);font-weight:700;border-radius:14px}
.empty{grid-column:1/-1;color:var(--sub);margin:0 0 4px}
.cart{position:sticky;top:0;height:100vh;height:100dvh;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow-y:auto}
.cart h2{margin:0;padding:12px 16px;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.lines{flex:1;overflow:auto;margin:0;padding:0 16px;list-style:none;min-height:60px}
.lines li>span:first-child{overflow-wrap:anywhere}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lines .sub{grid-column:1;color:var(--sub);font-size:.85rem}
.qty{display:flex;align-items:center;gap:6px;grid-row:1/3;grid-column:2}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:800}
.qty b{min-width:1.5em;text-align:center}
.amt{grid-row:1/3;grid-column:3;font-weight:700;min-width:4.5em;text-align:right}
.none{color:var(--sub);padding:12px 0}
.pay{padding:12px 16px 16px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--hi);color:var(--onhi);border-radius:12px;padding:10px 14px;font-weight:800}
.total output{font-size:2rem}
.paid{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.paid input{flex:1 1 100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.1rem;text-align:right}
.paid button{flex:1;padding:6px 4px;border:1px solid var(--line);background:var(--bg);border-radius:8px}
.change{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;margin-bottom:10px;min-height:1.7em}
.short{color:var(--danger)}
.done:disabled{opacity:.45;cursor:not-allowed}
.done{width:100%;padding:12px;border:0;border-radius:12px;background:var(--main);color:var(--onmain);font-weight:800;font-size:1.05rem}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:.85rem}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,380px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0 4px;font-weight:700;font-size:.9rem}
dialog input[type=text],dialog input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.prev{width:120px;height:120px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line);display:block;margin-bottom:8px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.row .ok{background:var(--main);color:var(--onmain);border-color:var(--main)}
.row .del{color:var(--danger)}
.soldout{position:absolute;left:8px;top:8px;background:var(--danger);color:var(--panel);border-radius:8px;padding:2px 8px;font-weight:800;font-size:.85rem}
.out .ph,.out .noimg{opacity:.45;filter:grayscale(1)}
.left{color:var(--sub);font-size:.85rem;margin-left:6px}
#adm{max-height:88dvh}
#adm ul{list-style:none;margin:0 0 8px;padding:0}
#adm li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
#adm li span:first-child{overflow-wrap:anywhere}
#adm h3{margin:16px 0 4px;font-size:.95rem}
#adm input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.big{font-size:2.2rem;font-weight:800}
.err{color:var(--danger);min-height:1.5em;margin:6px 0 0}
#login label{display:block;margin:10px 0 4px;font-weight:700;font-size:.9rem}
#login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.glance{padding:0 16px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.gs b{font-size:1.5rem}
.gs .link{margin-left:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.9rem;white-space:nowrap}
.chip b{margin-left:4px}
.chip.low{border-color:var(--hi);background:var(--hi);color:var(--onhi)}
.chip.zero{border-color:var(--danger);color:var(--danger)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px}
.cats[hidden]{display:none}
.cat{flex:none;padding:6px 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.cat[aria-pressed=true]{background:var(--main);color:var(--onmain);border-color:var(--main)}
dialog input:disabled{opacity:.4}
.mvs{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;pointer-events:none}
.mv{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:var(--panel);color:var(--main);display:grid;place-items:center;font-weight:800;box-shadow:0 2px 6px #0005;cursor:pointer}
.fr{font-style:normal;background:var(--hi);color:var(--onhi);border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:700}
dialog textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:inherit;resize:vertical}
dialog textarea:disabled{opacity:.4}
.row.col{flex-direction:column}
.row.col button{padding:14px;font-size:1.05rem}
#whoDlg ul{list-style:none;margin:0;padding:0}
#whoDlg li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
#whoDlg li span:first-child{overflow-wrap:anywhere}
#whoDlg h3{margin:12px 0 4px;font-size:.95rem}
.cat:disabled{opacity:.4;cursor:not-allowed}
.gmv{display:inline-block;padding:0 8px;color:var(--main);font-weight:800}
.cat[aria-pressed=true] .gmv{color:var(--onmain)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.keys button{padding:12px 0;font-size:1.25rem;font-weight:700;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.keys button:active{background:var(--line)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
@media (max-width:800px){
 .keys button{padding:8px 0;font-size:1.1rem}
 .app{grid-template-columns:minmax(0,1fr)}
 .cart{border-left:0;border-top:1px solid var(--line);top:auto;bottom:0;height:auto;max-height:52vh;max-height:52dvh;z-index:5}
 .lines{max-height:16dvh}
 .total output{font-size:1.6rem}
 .toggle{padding:5px 12px;font-size:.9rem}
 header{padding:8px 12px}
 .glance,.cats{padding-left:12px;padding-right:12px}
 .grid{padding:4px 12px 12px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
 .cart h2{padding:8px 12px}
 .lines{padding:0 12px}
 .pay{padding:8px 12px 10px}
 .paid{margin:6px 0 4px}
 .paid input{padding:8px}
 .change{margin-bottom:6px;font-size:1rem}
 .done{padding:10px}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
@media (max-height:520px){
 header{padding:4px 16px}
 .glance,.cats{padding-bottom:4px}
 .cart h2{padding:6px 16px}
 .pay{padding:6px 12px 8px}
 .total output{font-size:1.4rem}
}
</style>

<body>
<div class="app" id="app">
  <section class="shop">
    <header>
      <h1 id="title" role="button" tabindex="0" style="cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent">4Bレジ</h1>
      <div style="display:flex;gap:8px">
        <button class="toggle" id="admBtn">🔒 売上・在庫</button>
        <button class="toggle" id="editBtn" aria-pressed="false">商品を編集</button>
      </div>
    </header>
    <div class="glance" id="glance"></div>
    <div class="cats" id="cats" hidden></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart">
    <h2>お会計 <button class="link" id="clear">全部消す</button></h2>
    <ul class="lines" id="lines"></ul>
    <div class="pay">
      <div class="total"><span>合計</span><output id="total">¥0</output></div>
      <div class="paid">
        <input id="paid" type="text" readonly inputmode="none" placeholder="お預かり金額">
        <button data-p="exact">ちょうど</button>
        <button data-p="1000">1,000</button>
        <button data-p="5000">5,000</button>
        <button data-p="10000">10,000</button>
        <button data-p="clear">クリア</button>
      </div>
      <div class="keys" id="keys">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="0">0</button><button data-k="00">00</button><button data-k="B" aria-label="1文字消す">⌫</button>
      </div>
      <div class="change"><span id="cl">お釣り</span><span id="cv"></span></div>
      <button class="done" id="done">会計をおわる</button>
    </div>
  </aside>
</div>

<div id="toast" role="status" hidden></div>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 8px;font-size:1.1rem">商品を追加</h2>
  <img class="prev" id="prev" alt="">
  <input type="file" id="file" accept="image/*">
  <label for="nm">商品名</label>
  <input type="text" id="nm" maxlength="30">
  <label for="pr">値段(円・0円もOK)</label>
  <input type="number" id="pr" inputmode="numeric" min="0" placeholder="0">
  <label for="ct">ジャンル(例: ドリンク。空欄なら未分類)</label>
  <input type="text" id="ct" list="ctl" maxlength="20">
  <datalist id="ctl"></datalist>
  <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:12px 0 4px"><input type="checkbox" id="af" style="width:auto"> 押したとき「有料 / 無料」を選ばせる</label>
  <textarea id="an" rows="3" maxlength="200" placeholder="説明文(例: 景品と交換できる券です。有料ですか?無料ですか?)"></textarea>
  <label for="st">在庫数</label>
  <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:4px 0"><input type="checkbox" id="inf" style="width:auto"> 無限(在庫を数えない)</label>
  <input type="number" id="st" inputmode="numeric" min="0">
  <div class="row">
    <button class="del" id="del" hidden>削除</button>
    <button id="cancel">やめる</button>
    <button class="ok" id="ok">保存</button>
  </div>
</dialog>

<dialog id="adm">
  <div id="gate">
    <h2 id="gt" style="margin:0 0 10px;font-size:1.1rem"></h2>
    <input type="password" id="pw" autocomplete="off" aria-label="パスワード">
    <p class="err" id="gerr"></p>
    <div class="row"><button id="gcancel">閉じる</button><button class="ok" id="gok">開く</button></div>
  </div>
  <div id="rep" hidden>
    <h2 style="margin:0;font-size:1.1rem">今日の売上</h2>
    <div class="big" id="today"></div>
    <div id="tcount" style="color:var(--sub)"></div>
    <div style="margin:10px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px">
      <div style="color:var(--sub);font-size:.85rem">レジの合計金額</div>
      <div class="big" id="drawer" style="font-size:1.8rem"></div>
      <div style="display:flex;flex-wrap:wrap;gap:4px 14px">
        <button class="link" id="setDrawer">金額を入力し直す</button>
        <button class="link" id="adjDrawer">増減で修正する(＋/−)</button>
      </div>
    </div>
    <button class="link" id="resetToday" style="color:var(--danger)">今日の売上をリセット</button>
    <ul id="sold"></ul>
    <h3>ログイン別の売上(今日)</h3>
    <ul id="byw"></ul>
    <h3>在庫</h3>
    <ul id="stock"></ul>
    <h3>レジの金額の変更履歴</h3>
    <ul id="dlog"></ul>
    <h3>日別の売上(新しい順)</h3>
    <ul id="days"></ul>
    <button class="link" id="migrate" hidden>この端末のデータをクラウドへ移す(初回のみ)</button>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:8px">
      <button class="link" id="chpw">売上・在庫のパスワードを変更</button>
      <button class="link" id="chpwe">商品編集のパスワードを変更</button>
      <button class="link" id="relock">ロックし直す(次回からパスワードが必要)</button>
    </div>
    <div class="row"><button class="ok" id="rclose">閉じる</button></div>
  </div>
</dialog>

<dialog id="whoDlg">
  <h2 style="margin:0 0 4px;font-size:1.1rem">ログイン情報</h2>
  <div id="whoBody"></div>
  <div class="row"><button class="ok" id="whoClose">閉じる</button></div>
</dialog>

<dialog id="ask">
  <h2 id="askName" style="margin:0 0 8px;font-size:1.1rem"></h2>
  <p id="askNote" style="white-space:pre-wrap;margin:0 0 4px"></p>
  <div class="row col">
    <button class="ok" id="askPaid"></button>
    <button id="askFree">無料</button>
    <button id="askBack">戻る</button>
  </div>
</dialog>

<dialog id="login">
  <h2 style="margin:0 0 6px;font-size:1.1rem">レジにログイン</h2>
  <label for="em">メールアドレス</label>
  <input type="email" id="em" autocomplete="username">
  <label for="lp">パスワード</label>
  <input type="password" id="lp" autocomplete="current-password">
  <p class="err" id="lerr"></p>
  <div class="row"><button class="ok" id="lok">ログイン</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='reji-products-v1';
let products=[],cart={},freeCart={},edit=false,editing=null,img='';
try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(products))}catch(e){alert('保存できませんでした。写真が多すぎるかもしれません。')}};

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}

function drawGrid(){
  const g=$('#grid');g.classList.toggle('edit',edit);
  const list=[...products].sort(byOrder).filter(inCat);
  let h=products.length?'':'<p class="empty">まだ商品がありません。「商品を編集」から商品を追加してください。</p>';
  h+=list.map((p,i)=>{const st=typeof p.stock==='number';return `<button class="tile${st&&p.stock===0&&!edit?' out':''}" data-id="${p.id}">
    <div class="pic">${p.img?`<img class="ph" src="${p.img}" alt="">`:'<div class="noimg">🛒</div>'}</div>
    ${!edit&&nq(p.id)?`<span class="badge">${nq(p.id)}</span>`:''}
    ${!edit&&st&&p.stock===0?'<span class="soldout">売り切れ</span>':''}
    ${edit?`<span class="mvs"><span class="mv" role="button" aria-label="前へ移動" data-mv="-1"${i===0?' style="visibility:hidden"':''}>◀</span><span class="mv" role="button" aria-label="後ろへ移動" data-mv="1"${i===list.length-1?' style="visibility:hidden"':''}>▶</span></span>`:''}
    <div class="info"><div class="nm">${esc(p.name)}</div><div class="pr">${yen(p.price)}${st&&p.stock>0?`<span class="left">残り${p.stock}</span>`:''}</div></div></button>`}).join('');
  if(edit)h+='<button class="add" id="addBtn">＋ 商品を追加</button>';
  g.innerHTML=h;
}
const nq=id=>(cart[id]||0)+(freeCart[id]||0);
function total(){return products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0)}
function drawCart(){
  const items=products.filter(p=>nq(p.id));
  const li=(p,q,free)=>`<li><span>${esc(p.name)}${free?' <em class="fr">無料</em>':''}</span>
    <div class="qty"><button data-${free?'fm':'m'}="${p.id}" aria-label="減らす">−</button><b>${q}</b><button data-${free?'fa':'a'}="${p.id}" aria-label="増やす">＋</button></div>
    <span class="amt">${free?yen(0):yen(p.price*q)}</span><span class="sub">${free?'無料':yen(p.price)}</span></li>`;
  $('#lines').innerHTML=items.length?items.map(p=>(cart[p.id]?li(p,cart[p.id],false):'')+(freeCart[p.id]?li(p,freeCart[p.id],true):'')).join(''):'<li class="none">商品をタップすると追加されます</li>';
  $('#total').textContent=yen(total());
  drawChange();
}
function flowBlock(){
  if(edit)return '';
  const names=genreList();if(!names.length)return '';
  const first=names.slice(0,-1).find(n=>!chosen(n));
  if(first)return `「${first}」から選んでください`;
  if(!visitedLast)return '一番右のジャンルまで進んでください';
  return '';
}
function updateDone(){
  const b=$('#done'),n=Object.keys(cart).length+Object.keys(freeCart).length,pv=parseInt($('#paid').value,10);
  const flow=flowBlock(),need=n>0&&total()>0&&isNaN(pv);
  b.disabled=!!flow||need;
  b.textContent=flow||(need?'お預かり金額を入力してください':'会計をおわる');
}
function drawChange(){
  updateDone();
  const paid=parseInt($('#paid').value,10),t=total(),cl=$('#cl'),cv=$('#cv');
  cv.className='';
  if(isNaN(paid)||!t){cl.textContent='お釣り';cv.textContent='';return}
  if(paid<t){cl.textContent='不足';cv.textContent=yen(t-paid);cv.className='short'}
  else{cl.textContent='お釣り';cv.textContent=yen(paid-t)}
}
const redraw=()=>{drawCats();drawGrid();drawCart();drawGlance()};

$('#grid').addEventListener('click',e=>{
  const m=e.target.closest('.mv');
  if(m){moveProduct(m.closest('.tile').dataset.id,+m.dataset.mv);return}
  if(e.target.closest('#addBtn'))return openDlg(null);
  const t=e.target.closest('.tile');if(!t)return;
  const id=t.dataset.id;
  if(edit)return openDlg(products.find(p=>p.id===id));
  const p=products.find(x=>x.id===id);
  if(typeof p.stock==='number'&&nq(id)>=p.stock)return;
  if(p.askFree)return openAsk(p);
  cart[id]=(cart[id]||0)+1;redraw();
});
$('#lines').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const room=id=>{const p=products.find(x=>x.id===id);return !(typeof p.stock==='number'&&nq(id)>=p.stock)};
  if(b.dataset.a&&room(b.dataset.a))cart[b.dataset.a]++;
  if(b.dataset.fa&&room(b.dataset.fa))freeCart[b.dataset.fa]++;
  if(b.dataset.m&&--cart[b.dataset.m]<=0)delete cart[b.dataset.m];
  if(b.dataset.fm&&--freeCart[b.dataset.fm]<=0)delete freeCart[b.dataset.fm];
  redraw();
});

$('#done').onclick=()=>{
  const items=products.filter(p=>nq(p.id));
  if(!items.length)return;
  if(flowBlock())return;
  const t=total(),pv=parseInt($('#paid').value,10);
  if(!isNaN(pv)&&pv<t){alert('お預かり金額が足りません。');return}
  if(isNaN(pv)&&t>0)return;
  const paid=isNaN(pv)?t:pv;
  recordSale(items,paid,paid-t);reset();
  const b=$('#done');b.textContent='記録しました';setTimeout(updateDone,1500);
};

const byOrder=(a,b)=>((a.order??Infinity)-(b.order??Infinity))||(a.id<b.id?-1:1);
function moveProduct(id,dir){
  const all=[...products].sort(byOrder),vis=all.filter(inCat);
  const i=vis.findIndex(p=>p.id===id),j=i+dir;
  if(i<0||j<0||j>=vis.length)return;
  const a=all.indexOf(vis[i]),b=all.indexOf(vis[j]);
  [all[a],all[b]]=[all[b],all[a]];
  const ch=[];
  all.forEach((p,k)=>{if(p.order!==k){p.order=k;ch.push(p)}});
  if(sync){const bt=db.batch();ch.forEach(p=>bt.update(db.collection('products').doc(p.id),{order:p.order}));bt.commit().catch(fail)}
  else save();
  drawGrid();
}
/* --- ジャンル --- */
let cat='all';
const catOf=p=>(p.category||'').trim();
const inCat=p=>cat==='all'||(cat==='none'?!catOf(p):'c:'+catOf(p)===cat);
const GEN='reji-genres-v1';
let genreCache=[],visitedLast=false;
const getGenreOrder=()=>sync?genreCache:rd(GEN,[]);
function genreList(){
  const names=[...new Set(products.map(catOf).filter(Boolean))],ord=getGenreOrder();
  return [...ord.filter(n=>names.includes(n)),...names.filter(n=>!ord.includes(n))];
}
/* そのジャンルから何か選んだ(売り切れしかないジャンルは選んだ扱い) */
function chosen(n){
  const ps=products.filter(p=>catOf(p)===n);
  return ps.some(p=>nq(p.id)>0)||ps.every(p=>typeof p.stock==='number'&&p.stock<=0);
}
function moveGenre(name,dir){
  const list=genreList(),i=list.indexOf(name),j=i+dir;
  if(i<0||j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];
  if(sync){genreCache=list;db.doc('config/genres').set({order:list}).catch(fail)}else wr(GEN,list);
  drawCats();
}
function drawCats(){
  const names=genreList(),none=products.some(p=>!catOf(p)),el=$('#cats');
  el.hidden=!names.length;
  if(!names.length){cat='all';visitedLast=true;el.innerHTML='';return}
  const seq=!edit,open=i=>!seq||names.slice(0,i).every(chosen);
  const tabs=[];
  if(edit)tabs.push(['all','すべて']);
  names.forEach((n,i)=>tabs.push(['c:'+n,n,i]));
  if(none)tabs.push(['none','未分類']);
  const ok=tabs.some(t=>t[0]===cat)&&!(cat.startsWith('c:')&&!open(names.indexOf(cat.slice(2))));
  if(!ok){
    if(seq){let k=0;while(k<names.length-1&&chosen(names[k]))k++;cat='c:'+names[k];visitedLast=false}
    else cat='all';
  }
  if(seq&&cat==='c:'+names[names.length-1])visitedLast=true;
  el.innerHTML=tabs.map(([k,l,i])=>{
    const g=k.startsWith('c:'),locked=g&&!open(i);
    const L=edit&&g?`<span class="gmv" role="button" aria-label="左へ移動" data-g="${esc(l)}" data-d="-1"${i===0?' style="visibility:hidden"':''}>◀</span>`:'';
    const R=edit&&g?`<span class="gmv" role="button" aria-label="右へ移動" data-g="${esc(l)}" data-d="1"${i===names.length-1?' style="visibility:hidden"':''}>▶</span>`:'';
    return `<button class="cat" data-c="${esc(k)}" aria-pressed="${k===cat}"${locked?' disabled':''}>${L}${locked?'🔒 ':''}${esc(l)}${R}</button>`;
  }).join('');
}

function recordSale(items,paid,change){
  const k=today(),em=who(),ek=em.replace(/\./g,'%2E');
  if(!sync){
    const s=rd(SALES,{}),d=s[k]||(s[k]={total:0,paid:0,change:0,count:0,items:{}});
    items.forEach(p=>{
      const q=cart[p.id]||0,f=freeCart[p.id]||0;
      if(q){const it=d.items[p.id]||(d.items[p.id]={name:p.name,qty:0,amt:0});it.qty+=q;it.amt+=p.price*q}
      if(f){const k2=p.id+'_free',it=d.items[k2]||(d.items[k2]={name:p.name+'(無料)',qty:0,amt:0});it.qty+=f}
      if(typeof p.stock==='number')p.stock=Math.max(0,p.stock-q-f);
    });
    d.paid=(d.paid??d.total)+paid;d.change=(d.change||0)+change;d.total+=paid-change;d.count++;
    d.byEmail=d.byEmail||{};const be=d.byEmail[ek]||(d.byEmail[ek]={email:em,total:0,count:0});be.total+=paid-change;be.count++;
    const dr=rd(DRW,{balance:0,set:false});dr.balance+=paid-change;wr(DRW,dr);
    wr(SALES,s);save();return;
  }
  const inc=firebase.firestore.FieldValue.increment,its={};
  items.forEach(p=>{
    const q=cart[p.id]||0,f=freeCart[p.id]||0;
    if(q)its[p.id]={name:p.name,qty:inc(q),amt:inc(p.price*q)};
    if(f)its[p.id+'_free']={name:p.name+'(無料)',qty:inc(f),amt:inc(0)};
  });
  db.collection('sales').doc(k).set({total:inc(paid-change),paid:inc(paid),change:inc(change),count:inc(1),items:its,byEmail:{[ek]:{email:em,total:inc(paid-change),count:inc(1)}}},{merge:true}).catch(fail);
  db.doc('config/drawer').set({balance:inc(paid-change)},{merge:true}).catch(fail);
  const b=db.batch();let n=0;
  items.forEach(p=>{if(typeof p.stock==='number'){b.update(db.collection('products').doc(p.id),{stock:inc(-nq(p.id))});n++}});
  if(n)b.commit().catch(fail);
}
async function migrate(){
  const lp=rd(KEY,[]),ls=rd(SALES,{}),lpw=rd(PW,null);
  if(!lp.length&&!Object.keys(ls).length){alert('この端末に移せるデータはありません。');return}
  if(!confirm('この端末の商品・売上をクラウドに登録します。1回だけ実行してください。'))return;
  const b=db.batch();
  lp.forEach(p=>b.set(db.collection('products').doc(p.id),p));
  Object.keys(ls).forEach(k=>b.set(db.collection('sales').doc(k),ls[k]));
  if(lpw&&!pwCache.report)b.set(db.doc('config/pw'),lpw);
  try{await b.commit();alert('移しました。')}catch(e){fail(e)}
}

let gateMode='unlock';
async function hash(pw,salt){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function showGate(){
  $('#gate').hidden=false;$('#rep').hidden=true;$('#pw').value='';$('#gerr').textContent='';
  $('#gt').textContent=(gateKind==='edit'?'編集用':'売上・在庫用')+(gateMode==='set'?'パスワードを決める(4文字以上)':'パスワードを入力');
  $('#gok').textContent=gateMode==='set'?'決定':'開く';
  updateLock();
}
function renderRep(){
  const s=getSales(),t=s[today()]||{total:0,count:0,items:{}};
  $('#today').textContent=yen(t.total);
  $('#tcount').textContent=t.count+'件の会計';
  const dr=getDrawer();$('#drawer').textContent=dr&&dr.set?yen(dr.balance):'未設定';
  const f2=n=>String(n).padStart(2,'0');
  $('#dlog').innerHTML=getLog().slice(0,30).map(e=>{
    const d=new Date(e.at);
    const tx=e.type==='adj'?`${e.delta>0?'+':'−'}${yen(Math.abs(e.delta))}(${yen(e.before)} → ${yen(e.after)})`:(e.before==null?`設定 ${yen(e.after)}`:`入力し直し ${yen(e.before)} → ${yen(e.after)}`);
    return `<li><span>${d.getMonth()+1}/${d.getDate()} ${f2(d.getHours())}:${f2(d.getMinutes())}<br>${esc(e.email||'不明')}</span><span style="text-align:right">${tx}</span></li>`;
  }).join('')||'<li class="none">まだ変更の履歴はありません</li>';
  $('#sold').innerHTML=Object.values(t.items).map(i=>`<li><span>${esc(i.name)} × ${i.qty}</span><span>${yen(i.amt)}</span></li>`).join('')||'<li class="none">まだ売上がありません</li>';
  const be=Object.values(t.byEmail||{}),sum=be.reduce((a,x)=>a+x.total,0),rest=t.total-sum;
  $('#byw').innerHTML=be.map(x=>`<li><span>${esc(x.email)}</span><span>${yen(x.total)}(${x.count}件)</span></li>`).join('')+(rest>0&&t.count?`<li><span>メールアドレス不明(記録開始前の分)</span><span>${yen(rest)}</span></li>`:'')||'<li class="none">まだ売上がありません</li>';
  $('#stock').innerHTML=products.map(p=>{const st=typeof p.stock==='number';return `<li><span>${esc(p.name)}</span><span class="${st&&p.stock===0?'short':''}">${st?(p.stock===0?'売り切れ':p.stock+'個'):'∞ 無限'}</span></li>`}).join('')||'<li class="none">商品がありません</li>';
  $('#days').innerHTML=Object.keys(s).sort().reverse().slice(0,14).map(d=>`<li><span>${d}</span><span>${yen(s[d].total)}</span></li>`).join('')||'<li class="none">記録がありません</li>';
}
let gateKind='report',gateChange=false;
/* 1日1回パスワードを通したら、その端末ではその日は聞かない */
const ukey=k=>'reji-unlock-'+(sync&&firebase.auth().currentUser?firebase.auth().currentUser.uid:'local')+'-'+k;
const markUnlocked=(k,h)=>wr(ukey(k),{date:today(),h});
function isUnlocked(k){const u=rd(ukey(k),null),sv=getPw(k);return !!(u&&sv&&u.date===today()&&u.h===sv.h)}
/* 5回連続で間違えたら10分間ロック(この端末・パスワードの種類ごと) */
const LOCK_N=5,LOCK_MS=10*60*1000,fkey=k=>'reji-fail-'+k;
let lockTimer;
const lockLeft=k=>{const f=rd(fkey(k),null);return f&&f.until>Date.now()?f.until-Date.now():0};
const resetFail=k=>wr(fkey(k),{n:0,until:0});
function failed(k){
  const f=rd(fkey(k),{n:0}),n=(f.n||0)+1;
  if(n>=LOCK_N){wr(fkey(k),{n:0,until:Date.now()+LOCK_MS});return 0}
  wr(fkey(k),{n,until:0});return LOCK_N-n;
}
function updateLock(){
  clearInterval(lockTimer);
  let locked=false;
  const tick=()=>{
    const left=gateMode==='unlock'?lockLeft(gateKind):0;
    $('#pw').disabled=$('#gok').disabled=left>0;
    if(left>0){
      locked=true;const t=Math.ceil(left/1000);
      $('#gerr').textContent=`パスワードを${LOCK_N}回間違えました。あと${Math.floor(t/60)}分${String(t%60).padStart(2,'0')}秒たってから入力してください。`;
    }else{clearInterval(lockTimer);if(locked){locked=false;$('#gerr').textContent=''}}
  };
  tick();lockTimer=setInterval(tick,1000);
}
function openGate(kind){
  if(!(window.crypto&&crypto.subtle)){alert('この環境ではパスワード機能が使えません。https のアドレスで開いてください。');return}
  if(sync&&!pwLoaded){alert('同期中です。数秒待ってからもう一度押してください。');return}
  gateKind=kind;gateChange=false;gateMode=getPw(kind)?'unlock':'set';
  if(isUnlocked(kind)){
    if(kind==='edit')return setEdit(true);
    $('#gate').hidden=true;$('#rep').hidden=false;renderRep();return $('#adm').showModal();
  }
  showGate();$('#adm').showModal();
}
$('#admBtn').onclick=()=>{
  openGate('report');
};
$('#gok').onclick=async()=>{
  const pw=$('#pw').value;
  if(gateMode==='set'){
    if(pw.length<4){$('#gerr').textContent='4文字以上にしてください。';return}
    const salt=Date.now()+'-'+Math.random();
    const h=await hash(pw,salt);await setPw(gateKind,{salt,h});markUnlocked(gateKind,h);
  }else{
    const saved=getPw(gateKind);
    if(lockLeft(gateKind)){updateLock();return}
    if(!saved||await hash(pw,saved.salt)!==saved.h){
      const r=failed(gateKind);
      if(r===0){$('#pw').value='';updateLock()}
      else $('#gerr').textContent=`パスワードが違います。(あと${r}回間違えると10分間入力できなくなります)`;
      return;
    }
    resetFail(gateKind);markUnlocked(gateKind,saved.h);
  }
  if(gateKind==='edit'&&!gateChange){$('#adm').close();setEdit(true);return}
  gateChange=false;
  $('#gate').hidden=true;$('#rep').hidden=false;renderRep();
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#gok').click()});
$('#gcancel').onclick=$('#rclose').onclick=()=>$('#adm').close();
$('#chpw').onclick=()=>{gateKind='report';gateChange=true;gateMode='set';showGate()};
$('#chpwe').onclick=()=>{gateKind='edit';gateChange=true;gateMode='set';showGate()};
$('#relock').onclick=()=>{try{['report','edit'].forEach(k=>localStorage.removeItem(ukey(k)))}catch(e){}if(edit)setEdit(false);$('#adm').close()};
async function resetToday(){
  if(!confirm('今日の売上の記録を消します。在庫は元に戻りません。よろしいですか?'))return;
  const k=today();
  if(sync){try{await db.collection('sales').doc(k).delete()}catch(e){fail(e)}return}
  const s=rd(SALES,{});delete s[k];wr(SALES,s);renderRep();drawGlance();
}
$('#resetToday').onclick=resetToday;
$('#setDrawer').onclick=()=>{
  const dr=getDrawer(),cur=dr&&dr.set?dr.balance:'';
  const v=prompt('いまレジに入っている金額(円)を入力してください。この金額に、これからの売上が足されていきます。',cur);
  if(v===null)return;
  const n=parseInt(String(v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，\s]/g,''),10);
  if(isNaN(n)||n<0){alert('0以上の数字で入力してください。');return}
  if(dr&&dr.set&&!confirm(`レジの金額を ${yen(dr.balance)} → ${yen(n)} に変更します。よろしいですか?`))return;
  setDrawer(n);
};
function adjDrawer(n){
  const d0=getDrawer(),before=d0.balance;
  logDrawer('adj',before,before+n,n);
  if(sync)return db.doc('config/drawer').set({balance:firebase.firestore.FieldValue.increment(n),set:true},{merge:true}).catch(fail);
  const dr=rd(DRW,{balance:0,set:true});dr.balance+=n;dr.set=true;wr(DRW,dr);renderRep();
}
$('#adjDrawer').onclick=()=>{
  const dr=getDrawer();
  if(!(dr&&dr.set)){alert('先に「金額を入力し直す」で、レジの金額を設定してください。');return}
  const v=prompt('増減の金額を入力してください。\n増やすときは「+500」、減らすときは「-300」のように入力します。');
  if(v===null)return;
  const norm=String(v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/＋/g,'+').replace(/[−ー－―]/g,'-').replace(/[,，\s円]/g,'');
  const n=parseInt(norm,10);
  if(isNaN(n)||n===0){alert('「+500」や「-300」のように入力してください。');return}
  if(dr.balance+n<0){alert('レジの金額がマイナスになるため、変更できません。');return}
  if(!confirm(`レジの金額を ${yen(dr.balance)} → ${yen(dr.balance+n)} に変更します。よろしいですか?`))return;
  adjDrawer(n);
};
$('#adm').addEventListener('close',()=>{clearInterval(lockTimer);$('#rep').hidden=true;$('#gate').hidden=false});
redraw();
</script>
</body>
</html>
