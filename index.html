<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かんたんレジ</title>
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#1a2a29;--sub:#5d706e;--line:#d5dedc;--main:#0f5b57;--onmain:#fff;--hi:#f2c230;--onhi:#2a2100;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101817;--panel:#182322;--ink:#e8f0ef;--sub:#93a8a5;--line:#2b3b39;--main:#4fb3ab;--onmain:#06201e;--danger:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{height:100vh;height:100dvh;width:100%;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr)}
.shop{display:flex;flex-direction:column;min-height:0;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 16px}
h1{font-size:1.25rem;margin:0}
.toggle{border:2px solid var(--main);background:none;color:var(--main);border-radius:99px;padding:6px 16px;font-weight:700}
.toggle[aria-pressed=true]{background:var(--main);color:var(--onmain)}
.grid{flex:1;overflow:auto;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start}
.tile{position:relative;border:0;padding:0;background:var(--panel);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .ph{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:var(--line)}
.tile .noimg{aspect-ratio:1;display:grid;place-items:center;font-size:2.4rem;color:var(--sub);background:var(--line)}
.tile .info{padding:8px 10px 10px}
.tile .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .pr{color:var(--sub)}
.badge{position:absolute;top:8px;right:8px;min-width:32px;height:32px;padding:0 8px;border-radius:99px;background:var(--hi);color:var(--onhi);font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px #0003}
.edit .tile{outline:2px dashed var(--main);outline-offset:-2px}
.add{display:grid;place-items:center;min-height:170px;border:2px dashed var(--main);background:none;color:var(--main);font-weight:700;border-radius:14px}
.empty{grid-column:1/-1;color:var(--sub);margin:0 0 4px}
.cart{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow-y:auto}
.cart h2{margin:0;padding:12px 16px;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.lines{flex:1;overflow:auto;margin:0;padding:0 16px;list-style:none;min-height:60px}
.lines li>span:first-child{overflow-wrap:anywhere}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lines .sub{grid-column:1;color:var(--sub);font-size:.85rem}
.qty{display:flex;align-items:center;gap:6px;grid-row:1/3;grid-column:2}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:800}
.qty b{min-width:1.5em;text-align:center}
.amt{grid-row:1/3;grid-column:3;font-weight:700;min-width:4.5em;text-align:right}
.none{color:var(--sub);padding:12px 0}
.pay{padding:12px 16px 16px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--hi);color:var(--onhi);border-radius:12px;padding:10px 14px;font-weight:800}
.total output{font-size:2rem}
.paid{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.paid input{flex:1 1 100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.1rem;text-align:right}
.paid button{flex:1;padding:6px 4px;border:1px solid var(--line);background:var(--bg);border-radius:8px}
.change{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;margin-bottom:10px;min-height:1.7em}
.short{color:var(--danger)}
.done{width:100%;padding:12px;border:0;border-radius:12px;background:var(--main);color:var(--onmain);font-weight:800;font-size:1.05rem}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:.85rem}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,380px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0 4px;font-weight:700;font-size:.9rem}
dialog input[type=text],dialog input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.prev{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--line);display:block;margin-bottom:8px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.row .ok{background:var(--main);color:var(--onmain);border-color:var(--main)}
.row .del{color:var(--danger)}
.soldout{position:absolute;left:8px;top:8px;background:var(--danger);color:var(--panel);border-radius:8px;padding:2px 8px;font-weight:800;font-size:.85rem}
.out .ph,.out .noimg{opacity:.45;filter:grayscale(1)}
.left{color:var(--sub);font-size:.85rem;margin-left:6px}
#adm{max-height:88dvh}
#adm ul{list-style:none;margin:0 0 8px;padding:0}
#adm li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
#adm h3{margin:16px 0 4px;font-size:.95rem}
#adm input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.big{font-size:2.2rem;font-weight:800}
.err{color:var(--danger);min-height:1.5em;margin:6px 0 0}
#login label{display:block;margin:10px 0 4px;font-weight:700;font-size:.9rem}
#login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.glance{padding:0 16px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.gs b{font-size:1.5rem}
.gs .link{margin-left:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.9rem;white-space:nowrap}
.chip b{margin-left:4px}
.chip.low{border-color:var(--hi);background:var(--hi);color:var(--onhi)}
.chip.zero{border-color:var(--danger);color:var(--danger)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px}
.cats[hidden]{display:none}
.cat{flex:none;padding:6px 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.cat[aria-pressed=true]{background:var(--main);color:var(--onmain);border-color:var(--main)}
dialog input:disabled{opacity:.4}
@media (max-width:800px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
 .cart{border-left:0;border-top:1px solid var(--line);max-height:52dvh}
 .lines{max-height:16dvh}
 .total output{font-size:1.6rem}
 .toggle{padding:5px 12px;font-size:.9rem}
 header{padding:8px 12px}
 .glance,.cats{padding-left:12px;padding-right:12px}
 .grid{padding:4px 12px 12px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
 .cart h2{padding:8px 12px}
 .lines{padding:0 12px}
 .pay{padding:8px 12px 10px}
 .paid{margin:6px 0 4px}
 .paid input{padding:8px}
 .change{margin-bottom:6px;font-size:1rem}
 .done{padding:10px}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
@media (max-height:520px){
 header{padding:4px 16px}
 .glance,.cats{padding-bottom:4px}
 .cart h2{padding:6px 16px}
 .pay{padding:6px 12px 8px}
 .total output{font-size:1.4rem}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

</head>
<body>
<div class="app" id="app">
  <section class="shop">
    <header>
      <h1>かんたんレジ</h1>
      <div style="display:flex;gap:8px">
        <button class="toggle" id="admBtn">🔒 売上・在庫</button>
        <button class="toggle" id="editBtn" aria-pressed="false">商品を編集</button>
      </div>
    </header>
    <div class="glance" id="glance"></div>
    <div class="cats" id="cats" hidden></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart">
    <h2>お会計 <button class="link" id="clear">全部消す</button></h2>
    <ul class="lines" id="lines"></ul>
    <div class="pay">
      <div class="total"><span>合計</span><output id="total">¥0</output></div>
      <div class="paid">
        <input id="paid" type="number" inputmode="numeric" min="0" placeholder="お預かり金額">
        <button data-p="exact">ちょうど</button>
        <button data-p="1000">1,000</button>
        <button data-p="5000">5,000</button>
        <button data-p="10000">10,000</button>
      </div>
      <div class="change"><span id="cl">お釣り</span><span id="cv"></span></div>
      <button class="done" id="done">会計をおわる</button>
    </div>
  </aside>
</div>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 8px;font-size:1.1rem">商品を追加</h2>
  <img class="prev" id="prev" alt="">
  <input type="file" id="file" accept="image/*">
  <label for="nm">商品名</label>
  <input type="text" id="nm" maxlength="30">
  <label for="pr">値段(円)</label>
  <input type="number" id="pr" inputmode="numeric" min="0">
  <label for="ct">ジャンル(例: ドリンク。空欄なら未分類)</label>
  <input type="text" id="ct" list="ctl" maxlength="20">
  <datalist id="ctl"></datalist>
  <label for="st">在庫数</label>
  <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:4px 0"><input type="checkbox" id="inf" style="width:auto"> 無限(在庫を数えない)</label>
  <input type="number" id="st" inputmode="numeric" min="0">
  <div class="row">
    <button class="del" id="del" hidden>削除</button>
    <button id="cancel">やめる</button>
    <button class="ok" id="ok">保存</button>
  </div>
</dialog>

<dialog id="adm">
  <div id="gate">
    <h2 id="gt" style="margin:0 0 10px;font-size:1.1rem"></h2>
    <input type="password" id="pw" autocomplete="off" aria-label="パスワード">
    <p class="err" id="gerr"></p>
    <div class="row"><button id="gcancel">閉じる</button><button class="ok" id="gok">開く</button></div>
  </div>
  <div id="rep" hidden>
    <h2 style="margin:0;font-size:1.1rem">今日の売上</h2>
    <div class="big" id="today"></div>
    <div id="tcount" style="color:var(--sub)"></div>
    <button class="link" id="resetToday" style="color:var(--danger)">今日の売上をリセット</button>
    <ul id="sold"></ul>
    <h3>在庫</h3>
    <ul id="stock"></ul>
    <h3>日別の売上(新しい順)</h3>
    <ul id="days"></ul>
    <button class="link" id="migrate" hidden>この端末のデータをクラウドへ移す(初回のみ)</button>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:8px">
      <button class="link" id="chpw">売上・在庫のパスワードを変更</button>
      <button class="link" id="chpwe">商品編集のパスワードを変更</button>
    </div>
    <div class="row"><button class="ok" id="rclose">閉じる</button></div>
  </div>
</dialog>

<dialog id="login">
  <h2 style="margin:0 0 6px;font-size:1.1rem">レジにログイン</h2>
  <label for="em">メールアドレス</label>
  <input type="email" id="em" autocomplete="username">
  <label for="lp">パスワード</label>
  <input type="password" id="lp" autocomplete="current-password">
  <p class="err" id="lerr"></p>
  <div class="row"><button class="ok" id="lok">ログイン</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='reji-products-v1';
let products=[],cart={},edit=false,editing=null,img='';
try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(products))}catch(e){alert('保存できませんでした。写真が多すぎるかもしれません。')}};

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}

function drawGrid(){
  const g=$('#grid');g.classList.toggle('edit',edit);
  const list=products.filter(inCat);
  let h=products.length?'':'<p class="empty">まだ商品がありません。「商品を編集」から商品を追加してください。</p>';
  h+=list.map(p=>{const st=typeof p.stock==='number';return `<button class="tile${st&&p.stock===0&&!edit?' out':''}" data-id="${p.id}">
    ${p.img?`<img class="ph" src="${p.img}" alt="">`:'<div class="noimg">🛒</div>'}
    ${!edit&&cart[p.id]?`<span class="badge">${cart[p.id]}</span>`:''}
    ${!edit&&st&&p.stock===0?'<span class="soldout">売り切れ</span>':''}
    <div class="info"><div class="nm">${esc(p.name)}</div><div class="pr">${yen(p.price)}${st&&p.stock>0?`<span class="left">残り${p.stock}</span>`:''}</div></div></button>`}).join('');
  if(edit)h+='<button class="add" id="addBtn">＋ 商品を追加</button>';
  g.innerHTML=h;
}
function total(){return products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0)}
function drawCart(){
  const items=products.filter(p=>cart[p.id]);
  $('#lines').innerHTML=items.length?items.map(p=>`<li><span>${esc(p.name)}</span>
    <div class="qty"><button data-m="${p.id}" aria-label="減らす">−</button><b>${cart[p.id]}</b><button data-a="${p.id}" aria-label="増やす">＋</button></div>
    <span class="amt">${yen(p.price*cart[p.id])}</span><span class="sub">${yen(p.price)}</span></li>`).join(''):'<li class="none">商品をタップすると追加されます</li>';
  $('#total').textContent=yen(total());
  drawChange();
}
function drawChange(){
  const paid=parseInt($('#paid').value,10),t=total(),cl=$('#cl'),cv=$('#cv');
  cv.className='';
  if(isNaN(paid)||!t){cl.textContent='お釣り';cv.textContent='';return}
  if(paid<t){cl.textContent='不足';cv.textContent=yen(t-paid);cv.className='short'}
  else{cl.textContent='お釣り';cv.textContent=yen(paid-t)}
}
const redraw=()=>{drawCats();drawGrid();drawCart();drawGlance()};

$('#grid').addEventListener('click',e=>{
  if(e.target.closest('#addBtn'))return openDlg(null);
  const t=e.target.closest('.tile');if(!t)return;
  const id=t.dataset.id;
  if(edit)return openDlg(products.find(p=>p.id===id));
  const p=products.find(x=>x.id===id);
  if(typeof p.stock==='number'&&(cart[id]||0)>=p.stock)return;
  cart[id]=(cart[id]||0)+1;redraw();
});
$('#lines').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a){const p=products.find(x=>x.id===b.dataset.a);if(!(typeof p.stock==='number'&&cart[p.id]>=p.stock))cart[p.id]++}
  if(b.dataset.m&&--cart[b.dataset.m]<=0)delete cart[b.dataset.m];
  redraw();
});
function setEdit(v){edit=v;const b=$('#editBtn');b.setAttribute('aria-pressed',edit);b.textContent=edit?'編集をおわる':'商品を編集';drawGrid()}
$('#editBtn').onclick=()=>{if(edit)return setEdit(false);openGate('edit')};
$('#paid').oninput=drawChange;
document.querySelector('.paid').addEventListener('click',e=>{
  const p=e.target.dataset.p;if(!p)return;
  $('#paid').value=p==='exact'?total():p;drawChange();
});
const reset=()=>{cart={};$('#paid').value='';redraw()};
$('#clear').onclick=()=>{if(!Object.keys(cart).length||confirm('お会計の内容を全部消しますか?'))reset()};
const SALES='reji-sales-v1',PW='reji-pw-v1',PWE='reji-pwe-v1';
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('保存できませんでした。')}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('#done').onclick=()=>{
  const items=products.filter(p=>cart[p.id]);
  if(!items.length)return;
  recordSale(items);reset();
};

function openDlg(p){
  editing=p;img=p?p.img:'';
  $('#dt').textContent=p?'商品を編集':'商品を追加';
  $('#nm').value=p?p.name:'';$('#pr').value=p?p.price:'';$('#file').value='';
  const unl=!(p&&typeof p.stock==='number');
  $('#inf').checked=unl;$('#st').disabled=unl;
  $('#st').value=unl?'':p.stock;
  $('#ct').value=p?catOf(p):(cat.startsWith('c:')?cat.slice(2):'');
  $('#ctl').innerHTML=[...new Set(products.map(catOf).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('');
  $('#prev').src=img||'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  $('#del').hidden=!p;
  $('#dlg').showModal();
}
$('#file').onchange=async e=>{const f=e.target.files[0];if(f){img=await shrink(f);$('#prev').src=img}};
$('#cancel').onclick=()=>$('#dlg').close();
$('#ok').onclick=()=>{
  const name=$('#nm').value.trim(),price=parseInt($('#pr').value,10);
  if(!name||isNaN(price)||price<0){alert('商品名と値段を入力してください。');return}
  const inf=$('#inf').checked,sv=parseInt($('#st').value,10);
  if(!inf&&isNaN(sv)){alert('在庫数を入力するか、「無限」にチェックを入れてください。');return}
  const stock=inf?null:Math.max(0,sv);
  const p=editing||{id:'p'+Date.now()};
  Object.assign(p,{name,price,img,stock,category:$('#ct').value.trim()});
  if(!editing)products.push(p);
  putProduct(p);$('#dlg').close();redraw();
};
$('#del').onclick=()=>{
  if(!confirm(`「${editing.name}」を削除しますか?`))return;
  const id=editing.id;products=products.filter(p=>p!==editing);delete cart[id];
  delProduct(id);$('#dlg').close();redraw();
};
$('#inf').onchange=()=>{$('#st').disabled=$('#inf').checked};
/* --- ジャンル --- */
let cat='all';
const catOf=p=>(p.category||'').trim();
const inCat=p=>cat==='all'||(cat==='none'?!catOf(p):'c:'+catOf(p)===cat);
function drawCats(){
  const names=[...new Set(products.map(catOf).filter(Boolean))];
  const tabs=[['all','すべて'],...names.map(n=>['c:'+n,n])];
  if(names.length&&products.some(p=>!catOf(p)))tabs.push(['none','未分類']);
  if(!tabs.some(t=>t[0]===cat))cat='all';
  const el=$('#cats');el.hidden=!names.length;
  el.innerHTML=tabs.map(([k,l])=>`<button class="cat" data-c="${esc(k)}" aria-pressed="${k===cat}">${esc(l)}</button>`).join('');
}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;cat=b.dataset.c;drawCats();drawGrid()});
/* --- 保存先(同期モード / この端末だけモード) --- */
const sync=!!FB.apiKey&&!FB.apiKey.startsWith('ここに');
let db,salesCache={},pwCache={},pwSeen={},pwLoaded=false,unsubs=[];
const getSales=()=>sync?salesCache:rd(SALES,{});
const getPw=k=>sync?(pwCache[k]||null):rd(k==='edit'?PWE:PW,null);
const setPw=(k,v)=>sync?db.doc(k==='edit'?'config/pwe':'config/pw').set(v):wr(k==='edit'?PWE:PW,v);
const fail=e=>alert('保存できませんでした: '+e.message);
const putProduct=p=>sync?db.collection('products').doc(p.id).set(p).catch(fail):save();
const delProduct=id=>sync?db.collection('products').doc(id).delete().catch(fail):save();
function recordSale(items){
  const k=today();
  if(!sync){
    const s=rd(SALES,{}),d=s[k]||(s[k]={total:0,count:0,items:{}});
    items.forEach(p=>{const q=cart[p.id],it=d.items[p.id]||(d.items[p.id]={name:p.name,qty:0,amt:0});it.qty+=q;it.amt+=p.price*q;d.total+=p.price*q;if(typeof p.stock==='number')p.stock=Math.max(0,p.stock-q)});
    d.count++;wr(SALES,s);save();return;
  }
  const inc=firebase.firestore.FieldValue.increment,b=db.batch(),its={};let tot=0;
  items.forEach(p=>{
    const q=cart[p.id];its[p.id]={name:p.name,qty:inc(q),amt:inc(p.price*q)};tot+=p.price*q;
    if(typeof p.stock==='number')b.update(db.collection('products').doc(p.id),{stock:inc(-q)});
  });
  b.set(db.collection('sales').doc(k),{total:inc(tot),count:inc(1),items:its},{merge:true});
  b.commit().catch(fail);
}
async function migrate(){
  const lp=rd(KEY,[]),ls=rd(SALES,{}),lpw=rd(PW,null);
  if(!lp.length&&!Object.keys(ls).length){alert('この端末に移せるデータはありません。');return}
  if(!confirm('この端末の商品・売上をクラウドに登録します。1回だけ実行してください。'))return;
  const b=db.batch();
  lp.forEach(p=>b.set(db.collection('products').doc(p.id),p));
  Object.keys(ls).forEach(k=>b.set(db.collection('sales').doc(k),ls[k]));
  if(lpw&&!pwCache.report)b.set(db.doc('config/pw'),lpw);
  try{await b.commit();alert('移しました。')}catch(e){fail(e)}
}
if(sync){
  firebase.initializeApp(FB);
  db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  $('#migrate').hidden=false;$('#migrate').onclick=migrate;
  $('#lok').onclick=async()=>{
    $('#lerr').textContent='';
    try{await firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#lp').value)}
    catch(e){$('#lerr').textContent='ログインできませんでした。メールアドレスとパスワードを確認してください。'}
  };
  $('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lok').click()});
  $('#login').addEventListener('cancel',e=>e.preventDefault());
  firebase.auth().onAuthStateChanged(u=>{
    unsubs.forEach(f=>f());unsubs=[];
    if(!u){products=[];redraw();if(!$('#login').open)$('#login').showModal();return}
    if($('#login').open)$('#login').close();
    unsubs.push(db.collection('products').onSnapshot(q=>{
      products=q.docs.map(d=>{const x=d.data();if(typeof x.stock==='number')x.stock=Math.max(0,x.stock);return{...x,id:d.id}}).sort((a,b)=>a.id<b.id?-1:1);
      redraw();
    },fail));
    unsubs.push(db.collection('sales').onSnapshot(q=>{
      salesCache={};q.forEach(d=>salesCache[d.id]=d.data());
      drawGlance();if(!$('#rep').hidden)renderRep();
    },fail));
    [['report','config/pw'],['edit','config/pwe']].forEach(([k,path])=>unsubs.push(db.doc(path).onSnapshot(d=>{pwCache[k]=d.exists?d.data():null;pwSeen[k]=true;pwLoaded=!!(pwSeen.report&&pwSeen.edit)},fail)));
  });
}
/* --- 一覧バー --- */
function drawGlance(){
  const t=getSales()[today()]||{total:0,count:0},hide=rd('reji-hide',false);
  const chips=products.filter(p=>typeof p.stock==='number').map(p=>`<span class="chip${p.stock===0?' zero':p.stock<=3?' low':''}">${esc(p.name)}<b>${p.stock}</b></span>`).join('')||'<span class="chip">在庫を数える商品はありません</span>';
  $('#glance').innerHTML=`<div class="gs"><span>今日の売上</span><b>${hide?'¥•••':yen(t.total)}</b><span>${t.count}件</span><button class="link" id="hideBtn">${hide?'金額を表示':'金額を隠す'}</button></div><div class="chips">${chips}</div>`;
}
$('#glance').addEventListener('click',e=>{if(e.target.id==='hideBtn'){wr('reji-hide',!rd('reji-hide',false));drawGlance()}});
/* --- 売上・在庫(パスワード) --- */
let gateMode='unlock';
async function hash(pw,salt){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function showGate(){
  $('#gate').hidden=false;$('#rep').hidden=true;$('#pw').value='';$('#gerr').textContent='';
  $('#gt').textContent=(gateKind==='edit'?'編集用':'売上・在庫用')+(gateMode==='set'?'パスワードを決める(4文字以上)':'パスワードを入力');
  $('#gok').textContent=gateMode==='set'?'決定':'開く';
}
function renderRep(){
  const s=getSales(),t=s[today()]||{total:0,count:0,items:{}};
  $('#today').textContent=yen(t.total);
  $('#tcount').textContent=t.count+'件の会計';
  $('#sold').innerHTML=Object.values(t.items).map(i=>`<li><span>${esc(i.name)} × ${i.qty}</span><span>${yen(i.amt)}</span></li>`).join('')||'<li class="none">まだ売上がありません</li>';
  $('#stock').innerHTML=products.map(p=>{const st=typeof p.stock==='number';return `<li><span>${esc(p.name)}</span><span class="${st&&p.stock===0?'short':''}">${st?(p.stock===0?'売り切れ':p.stock+'個'):'∞ 無限'}</span></li>`}).join('')||'<li class="none">商品がありません</li>';
  $('#days').innerHTML=Object.keys(s).sort().reverse().slice(0,14).map(d=>`<li><span>${d}</span><span>${yen(s[d].total)}</span></li>`).join('')||'<li class="none">記録がありません</li>';
}
let gateKind='report',gateChange=false;
function openGate(kind){
  if(!(window.crypto&&crypto.subtle)){alert('この環境ではパスワード機能が使えません。https のアドレスで開いてください。');return}
  if(sync&&!pwLoaded){alert('同期中です。数秒待ってからもう一度押してください。');return}
  gateKind=kind;gateChange=false;gateMode=getPw(kind)?'unlock':'set';
  showGate();$('#adm').showModal();
}
$('#admBtn').onclick=()=>{
  openGate('report');
};
$('#gok').onclick=async()=>{
  const pw=$('#pw').value;
  if(gateMode==='set'){
    if(pw.length<4){$('#gerr').textContent='4文字以上にしてください。';return}
    const salt=Date.now()+'-'+Math.random();
    await setPw(gateKind,{salt,h:await hash(pw,salt)});
  }else{
    const saved=getPw(gateKind);
    if(!saved||await hash(pw,saved.salt)!==saved.h){$('#gerr').textContent='パスワードが違います。';return}
  }
  if(gateKind==='edit'&&!gateChange){$('#adm').close();setEdit(true);return}
  gateChange=false;
  $('#gate').hidden=true;$('#rep').hidden=false;renderRep();
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#gok').click()});
$('#gcancel').onclick=$('#rclose').onclick=()=>$('#adm').close();
$('#chpw').onclick=()=>{gateKind='report';gateChange=true;gateMode='set';showGate()};
$('#chpwe').onclick=()=>{gateKind='edit';gateChange=true;gateMode='set';showGate()};
async function resetToday(){
  if(!confirm('今日の売上の記録を消します。在庫は元に戻りません。よろしいですか?'))return;
  const k=today();
  if(sync){try{await db.collection('sales').doc(k).delete()}catch(e){fail(e)}return}
  const s=rd(SALES,{});delete s[k];wr(SALES,s);renderRep();drawGlance();
}
$('#resetToday').onclick=resetToday;
$('#adm').addEventListener('close',()=>{$('#rep').hidden=true;$('#gate').hidden=false});
redraw();
</script>
</body>
</html>
