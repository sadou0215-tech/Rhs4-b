<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かんたんレジ</title>
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#1a2a29;--sub:#5d706e;--line:#d5dedc;--main:#0f5b57;--onmain:#fff;--hi:#f2c230;--onhi:#2a2100;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101817;--panel:#182322;--ink:#e8f0ef;--sub:#93a8a5;--line:#2b3b39;--main:#4fb3ab;--onmain:#06201e;--danger:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-columns:1fr 360px}
.shop{display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
h1{font-size:1.25rem;margin:0}
.toggle{border:2px solid var(--main);background:none;color:var(--main);border-radius:99px;padding:6px 16px;font-weight:700}
.toggle[aria-pressed=true]{background:var(--main);color:var(--onmain)}
.grid{flex:1;overflow:auto;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start}
.tile{position:relative;border:0;padding:0;background:var(--panel);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .ph{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:var(--line)}
.tile .noimg{aspect-ratio:1;display:grid;place-items:center;font-size:2.4rem;color:var(--sub);background:var(--line)}
.tile .info{padding:8px 10px 10px}
.tile .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .pr{color:var(--sub)}
.badge{position:absolute;top:8px;right:8px;min-width:32px;height:32px;padding:0 8px;border-radius:99px;background:var(--hi);color:var(--onhi);font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px #0003}
.edit .tile{outline:2px dashed var(--main);outline-offset:-2px}
.add{display:grid;place-items:center;min-height:170px;border:2px dashed var(--main);background:none;color:var(--main);font-weight:700;border-radius:14px}
.empty{grid-column:1/-1;color:var(--sub);margin:0 0 4px}
.cart{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart h2{margin:0;padding:12px 16px;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.lines{flex:1;overflow:auto;margin:0;padding:0 16px;list-style:none;min-height:60px}
.lines li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lines .sub{grid-column:1;color:var(--sub);font-size:.85rem}
.qty{display:flex;align-items:center;gap:6px;grid-row:1/3;grid-column:2}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:800}
.qty b{min-width:1.5em;text-align:center}
.amt{grid-row:1/3;grid-column:3;font-weight:700;min-width:4.5em;text-align:right}
.none{color:var(--sub);padding:12px 0}
.pay{padding:12px 16px 16px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--hi);color:var(--onhi);border-radius:12px;padding:10px 14px;font-weight:800}
.total output{font-size:2rem}
.paid{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.paid input{flex:1 1 100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.1rem;text-align:right}
.paid button{flex:1;padding:6px 4px;border:1px solid var(--line);background:var(--bg);border-radius:8px}
.change{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;margin-bottom:10px;min-height:1.7em}
.short{color:var(--danger)}
.done{width:100%;padding:12px;border:0;border-radius:12px;background:var(--main);color:var(--onmain);font-weight:800;font-size:1.05rem}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:.85rem}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,380px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0 4px;font-weight:700;font-size:.9rem}
dialog input[type=text],dialog input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.prev{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--line);display:block;margin-bottom:8px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.row .ok{background:var(--main);color:var(--onmain);border-color:var(--main)}
.row .del{color:var(--danger)}
@media (max-width:800px){
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
 .cart{border-left:0;border-top:1px solid var(--line);max-height:52dvh}
 .lines{max-height:16dvh}
 .total output{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="shop">
    <header>
      <h1>かんたんレジ</h1>
      <button class="toggle" id="editBtn" aria-pressed="false">商品を編集</button>
    </header>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart">
    <h2>お会計 <button class="link" id="clear">全部消す</button></h2>
    <ul class="lines" id="lines"></ul>
    <div class="pay">
      <div class="total"><span>合計</span><output id="total">¥0</output></div>
      <div class="paid">
        <input id="paid" type="number" inputmode="numeric" min="0" placeholder="お預かり金額">
        <button data-p="exact">ちょうど</button>
        <button data-p="1000">1,000</button>
        <button data-p="5000">5,000</button>
        <button data-p="10000">10,000</button>
      </div>
      <div class="change"><span id="cl">お釣り</span><span id="cv"></span></div>
      <button class="done" id="done">会計をおわる</button>
    </div>
  </aside>
</div>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 8px;font-size:1.1rem">商品を追加</h2>
  <img class="prev" id="prev" alt="">
  <input type="file" id="file" accept="image/*">
  <label for="nm">商品名</label>
  <input type="text" id="nm" maxlength="30">
  <label for="pr">値段(円)</label>
  <input type="number" id="pr" inputmode="numeric" min="0">
  <div class="row">
    <button class="del" id="del" hidden>削除</button>
    <button id="cancel">やめる</button>
    <button class="ok" id="ok">保存</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='reji-products-v1';
let products=[],cart={},edit=false,editing=null,img='';
try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(products))}catch(e){alert('保存できませんでした。写真が多すぎるかもしれません。')}};

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}

function drawGrid(){
  const g=$('#grid');g.classList.toggle('edit',edit);
  let h=products.length?'':'<p class="empty">まだ商品がありません。「＋ 商品を追加」から写真と値段を登録しましょう。</p>';
  h+=products.map(p=>`<button class="tile" data-id="${p.id}">
    ${p.img?`<img class="ph" src="${p.img}" alt="">`:'<div class="noimg">🛒</div>'}
    ${!edit&&cart[p.id]?`<span class="badge">${cart[p.id]}</span>`:''}
    <div class="info"><div class="nm">${esc(p.name)}</div><div class="pr">${yen(p.price)}</div></div></button>`).join('');
  if(edit||!products.length)h+='<button class="add" id="addBtn">＋ 商品を追加</button>';
  g.innerHTML=h;
}
function total(){return products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0)}
function drawCart(){
  const items=products.filter(p=>cart[p.id]);
  $('#lines').innerHTML=items.length?items.map(p=>`<li><span>${esc(p.name)}</span>
    <div class="qty"><button data-m="${p.id}" aria-label="減らす">−</button><b>${cart[p.id]}</b><button data-a="${p.id}" aria-label="増やす">＋</button></div>
    <span class="amt">${yen(p.price*cart[p.id])}</span><span class="sub">${yen(p.price)}</span></li>`).join(''):'<li class="none">商品をタップすると追加されます</li>';
  $('#total').textContent=yen(total());
  drawChange();
}
function drawChange(){
  const paid=parseInt($('#paid').value,10),t=total(),cl=$('#cl'),cv=$('#cv');
  cv.className='';
  if(isNaN(paid)||!t){cl.textContent='お釣り';cv.textContent='';return}
  if(paid<t){cl.textContent='不足';cv.textContent=yen(t-paid);cv.className='short'}
  else{cl.textContent='お釣り';cv.textContent=yen(paid-t)}
}
const redraw=()=>{drawGrid();drawCart()};

$('#grid').addEventListener('click',e=>{
  if(e.target.closest('#addBtn'))return openDlg(null);
  const t=e.target.closest('.tile');if(!t)return;
  const id=t.dataset.id;
  if(edit)return openDlg(products.find(p=>p.id===id));
  cart[id]=(cart[id]||0)+1;redraw();
});
$('#lines').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a)cart[b.dataset.a]++;
  if(b.dataset.m&&--cart[b.dataset.m]<=0)delete cart[b.dataset.m];
  redraw();
});
$('#editBtn').onclick=e=>{edit=!edit;e.currentTarget.setAttribute('aria-pressed',edit);e.currentTarget.textContent=edit?'編集をおわる':'商品を編集';drawGrid()};
$('#paid').oninput=drawChange;
document.querySelector('.paid').addEventListener('click',e=>{
  const p=e.target.dataset.p;if(!p)return;
  $('#paid').value=p==='exact'?total():p;drawChange();
});
const reset=()=>{cart={};$('#paid').value='';redraw()};
$('#clear').onclick=()=>{if(!Object.keys(cart).length||confirm('お会計の内容を全部消しますか?'))reset()};
$('#done').onclick=reset;

function openDlg(p){
  editing=p;img=p?p.img:'';
  $('#dt').textContent=p?'商品を編集':'商品を追加';
  $('#nm').value=p?p.name:'';$('#pr').value=p?p.price:'';$('#file').value='';
  $('#prev').src=img||'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  $('#del').hidden=!p;
  $('#dlg').showModal();
}
$('#file').onchange=async e=>{const f=e.target.files[0];if(f){img=await shrink(f);$('#prev').src=img}};
$('#cancel').onclick=()=>$('#dlg').close();
$('#ok').onclick=()=>{
  const name=$('#nm').value.trim(),price=parseInt($('#pr').value,10);
  if(!name||isNaN(price)||price<0){alert('商品名と値段を入力してください。');return}
  if(editing)Object.assign(editing,{name,price,img});
  else products.push({id:'p'+Date.now(),name,price,img});
  save();$('#dlg').close();redraw();
};
$('#del').onclick=()=>{
  if(!confirm(`「${editing.name}」を削除しますか?`))return;
  products=products.filter(p=>p!==editing);delete cart[editing.id];
  save();$('#dlg').close();redraw();
};
redraw();
</script>
</body>
</html>
